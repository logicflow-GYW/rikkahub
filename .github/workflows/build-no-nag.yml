name: Build No-Nag RikkaHub

on:
  workflow_dispatch: # 支持手动点击按钮触发编译
  schedule:
    - cron: '0 0 * * 0' # 每周日自动运行一次，自动拉取官网最新代码

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream code
        uses: actions/checkout@v4
        with:
          repository: rikkahub/rikkahub
          ref: main # 拉取官网最新的 main 分支

      - name: Apply No-Nag Patch (去弹窗修补)
        run: |
          FILE="app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt"
          # 用 sed 把弹窗判断条件替换为 if (false)
          sed -i 's/if (settings.launchCount > 100 && (settings.launchCount - settings.sponsorAlertDismissedAt) >= 50)/if (false)/g' $FILE
          echo "Patch successfully applied!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-no-nag-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
