name: Daily Build

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 Release 需要写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 构建 web-ui 前端资源
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Build web-ui resources
        working-directory: web-ui
        run: pnpm run build

      - name: Prepare build files (Sign & Config)
        run: |
          # 自动解码内嵌的 keystore 证书
          echo "" | base64 -d > app/app.key

          # 自动写入签名密码配置到 rootProject 的 local.properties 
          echo "storeFile=app.key" > local.properties
          echo "storePassword=rikkahub123" >> local.properties
          echo "keyAlias=rikkahub-key" >> local.properties
          echo "keyPassword=rikkahub123" >> local.properties

          # 自动生成最小化合法的 google-services.json
          echo '{"project_info":{"project_number":"1234567890","project_id":"placeholder-project-id","storage_bucket":"placeholder-project-id.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef123456","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"placeholder_api_key"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x :web:buildWebUi

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Daily Build (去弹窗签名版)
          body: |
            这是自动编译的去弹窗签名版 RikkaHub APK，已同步最新代码。
            直接下载下方的 `RikkaHub-nightly.apk` 安装即可。
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
